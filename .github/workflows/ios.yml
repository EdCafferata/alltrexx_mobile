name: iOS CI

# Build + test + lint op elke push/PR naar main, tegen de nieuwste stabiele Xcode/SDK.
# Vangt build- en opstart-crashes vóór een release. Geen signing nodig (simulator).

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --reporter github-actions-logging

  build-test:
    name: Build & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
ids=[x['udid'] for rt,devs in d.items() if 'iOS' in rt for x in devs if 'iPhone' in x['name']]; \
print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then echo 'Geen iPhone-simulator gevonden'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Gekozen simulator: $UDID"

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AlltrexxMobile.xcodeproj \
            -scheme AlltrexxMobile \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
